name: Publicar Luxi Validada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-luxi-validada
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório de publicação
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar token da fonte
        env:
          SOURCE_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.LUXI_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN" || (echo "::error::Configure DEPLOY_TOKEN ou LUXI_SOURCE_TOKEN no repositório de publicação." && exit 1)

      - name: Baixar fonte privada Luxi
        uses: actions/checkout@v4
        with:
          repository: Cleberamonjr/organize-jewelry
          ref: main
          path: _fonte
          token: ${{ secrets.DEPLOY_TOKEN || secrets.LUXI_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _fonte/package-lock.json

      - name: Instalar dependências
        working-directory: _fonte
        run: npm ci

      - name: Validar código
        working-directory: _fonte
        run: npm run verificar
        env:
          VITE_SUPABASE_URL: https://eraxjtfedswksiyigasf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_n4NDtzQFfOU3f2p2RFUvVQ_ZLqtFmsx

      - name: Gerar build
        working-directory: _fonte
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://eraxjtfedswksiyigasf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_n4NDtzQFfOU3f2p2RFUvVQ_ZLqtFmsx

      - name: Publicar build no repositório conectado ao Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _fonte -exec rm -rf {} +
          cp -R _fonte/dist/. .
          cp index.html 404.html
          touch .nojekyll
          rm -rf _fonte
          git config user.name "Luxi dev"
          git config user.email "luxi-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no bundle."
            exit 0
          fi
          git commit -m "build: publicar Luxi a partir da fonte validada [skip ci]"
          git push origin main
