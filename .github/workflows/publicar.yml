name: Publicar Luxi a partir do código-fonte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código-fonte privado
        uses: actions/checkout@v4
        with:
          repository: Cleberamonjr/organize-jewelry
          ref: main
          path: source
          token: ${{ secrets.DEPLOY_TOKEN }}
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Instalar dependências
        working-directory: source
        run: npm ci

      - name: Validar aplicação
        working-directory: source
        run: npm run verificar
        env:
          VITE_SUPABASE_URL: https://eraxjtfedswksiyigasf.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gerar build
        working-directory: source
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://eraxjtfedswksiyigasf.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publicar bundle
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete source/dist/ ./ --exclude '.git/' --exclude '.github/'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publicar versão da Luxi [skip ci]"
          git push origin HEAD:main
