name: Publicar Luxi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-luxi
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório de publicação
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Baixar fonte Luxi
        uses: actions/checkout@v6
        with:
          repository: Cleberamonjr/organize-jewelry
          ref: main
          path: _fonte
          token: ${{ secrets.LUXI_SOURCE_TOKEN }}

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _fonte/package-lock.json

      - name: Instalar dependências
        working-directory: _fonte
        run: npm ci

      - name: Revalidar build
        working-directory: _fonte
        run: npm run verificar

      - name: Gerar dist
        working-directory: _fonte
        run: npm run build

      - name: Atualizar arquivos publicados
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _fonte -exec rm -rf {} +
          cp -R _fonte/dist/. .
          cp index.html 404.html
          touch .nojekyll
          rm -rf _fonte
          git config user.name "Luxi dev"
          git config user.email "luxi-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração publicada."
            exit 0
          fi
          git commit -m "build: publicar Luxi a partir da fonte validada [skip ci]"
          git push origin main
